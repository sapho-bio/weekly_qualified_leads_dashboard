name: Refresh HubSpot leads and publish

on:
  schedule:
    - cron: '0 13 * * 1'   # every Monday, 13:00 UTC
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull leads from HubSpot
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: |
          if [ -z "$HUBSPOT_TOKEN" ]; then
            echo "::warning::HUBSPOT_TOKEN secret is not set. Publishing the dashboard without live HubSpot data."
          else
            node scripts/sync_hubspot.mjs
          fi

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          if [ -f data/hubspot_leads.json ]; then cp data/hubspot_leads.json _site/data/; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
